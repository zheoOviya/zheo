name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build (gate)
        run: pnpm build

      - name: Test (API + packages) with coverage gate
        run: pnpm exec vitest run --coverage

      - name: "Test (real infra: Postgres + Redis, mandatory)"
        run: pnpm exec vitest run apps/api/src/services/redis.realInfra.test.ts apps/api/src/services/payments.pgintegration.test.ts
        env:
          TEST_REAL_INFRA: "true"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          REDIS_URL: redis://127.0.0.1:6379
          TEST_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          TEST_REDIS_URL: redis://127.0.0.1:6379

      - name: Test (frontend suites)
        run: |
          pnpm --filter @snakzap/consumer test
          pnpm --filter @snakzap/vendor test
          pnpm --filter @snakzap/admin test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm test:e2e
        env:
          RATE_LIMIT_OTP_PER_MINUTE: "50"
