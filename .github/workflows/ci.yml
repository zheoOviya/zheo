name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build (gate)
        run: pnpm build

      - name: Test (API + packages) with coverage gate
        run: pnpm exec vitest run --coverage

      - name: Test (frontend suites)
        run: |
          pnpm --filter @snakzap/consumer test
          pnpm --filter @snakzap/vendor test
          pnpm --filter @snakzap/admin test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm test:e2e
        env:
          RATE_LIMIT_OTP_PER_MINUTE: "50"
