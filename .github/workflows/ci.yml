name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build (gate)
        run: pnpm build

      - name: Build API container image (SEC-P0-2)
        run: docker build --tag snakzap-api:sec-p0-2 .

      - name: Verify API container runs as non-root (SEC-P0-2)
        run: |
          set -euo pipefail
          configured_user="$(docker inspect --format '{{.Config.User}}' snakzap-api:sec-p0-2)"
          echo "Configured container user: '$configured_user'"
          if [ "$configured_user" != "node" ]; then
            echo "Expected Config.User=node, got '$configured_user'"
            exit 1
          fi
          runtime_uid="$(docker run --rm --entrypoint id snakzap-api:sec-p0-2 -u)"
          echo "Runtime uid: '$runtime_uid'"
          if [ "$runtime_uid" != "1000" ]; then
            echo "Expected runtime uid 1000, got '$runtime_uid'"
            exit 1
          fi
          docker run --rm --entrypoint id snakzap-api:sec-p0-2
          docker run --rm --entrypoint node snakzap-api:sec-p0-2 \
            -e 'process.exit(process.getuid() === 0 ? 1 : 0)'
          docker run --rm --entrypoint sh snakzap-api:sec-p0-2 \
            -c 'test -r /app/apps/api/dist/index.js'
          set +e
          docker run --rm --entrypoint sh snakzap-api:sec-p0-2 -c 'test -w /app'
          write_check=$?
          set -e
          if [ "$write_check" -eq 0 ]; then
            echo "Expected /app to be non-writable for the runtime user"
            exit 1
          fi
          if [ "$write_check" -ne 1 ]; then
            echo "Unexpected exit code from /app write check: $write_check"
            exit 1
          fi

      - name: Test (API + packages) with coverage gate
        run: pnpm exec vitest run --coverage

      - name: Test (frontend suites)
        run: |
          pnpm --filter @snakzap/consumer test
          pnpm --filter @snakzap/vendor test
          pnpm --filter @snakzap/admin test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm test:e2e
        env:
          RATE_LIMIT_OTP_PER_MINUTE: "50"
